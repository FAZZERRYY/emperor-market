{% for item in items %}
<div class="offer-card">
    <div class="seller-block">
        <div class="avatar-wrap">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed={{ item.seller.username }}" alt="Аватар" class="seller-img">
            <div class="status-dot"></div>
        </div>
        <div class="seller-info">
            <h4>{{ item.seller.username }}</h4>
            <div class="rating">★ {{ item.seller.rating }} <span>(142 отзыва)</span></div>
        </div>
    </div>
    
    <div class="item-block">
        <h3 class="item-title">{{ item.title }}</h3>
        <div class="item-tags">
            <span class="tag highlight">Комиссия на мне</span>
            <span class="tag">Выдача 5 мин</span>
        </div>
    </div>

    <div class="action-block">
        <div class="price-wrap">
            <p>Цена за лот</p>
            <div class="price">{{ item.price }} ₽</div>
        </div>
        <button class="btn-buy">Купить</button>
    </div>
</div>
{% endfor %}
